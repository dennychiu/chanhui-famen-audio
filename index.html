
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8eedb">
<title>懺悔法門語音｜花蓮祥德寺</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
  background: #f8f1e5;
  color: #65452d;
}

header {
  text-align: center;
  padding: 35px 18px;
  background: linear-gradient(145deg,#f8e4b9,#fff9eb,#e9c98e);
}

header img {
  width: 100%;
  max-width: 500px;
  border-radius: 16px;
  display: block;
  margin: auto auto 20px;
}

h1 {
  font-size: 29px;
  margin: 12px 0;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 14px;
  color: #92714d;
}

main {
  max-width: 620px;
  margin: auto;
  padding: 20px 16px 40px;
}

.audio-card {
  background: #fffdf8;
  border: 1px solid #e5d2ae;
  border-radius: 15px;
  padding: 22px 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 12px #76552a12;
}

.audio-card h2 {
  font-size: 18px;
  margin: 0 0 15px;
}

audio {
  width: 100%;
  height: 45px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #927b5c;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <img src="ksitigarbha.png" alt="地藏菩薩">
  <h1>懺悔法門語音</h1>
  <div class="subtitle">
    花蓮祥德寺・語音弘法專區
  </div>
</header>

<main>

  <section class="audio-card">
    <h2>一、懺悔法門語音引導</h2>
    <audio controls preload="metadata">
      <source src="guide.mp4" type="audio/mp4">
      您的瀏覽器不支援音訊播放。
    </audio>
  </section>

  <section class="audio-card">
    <h2>二、懺悔法門開示（上）</h2>
    <audio controls preload="metadata">
      <source src="part1.mp3" type="audio/mpeg">
      您的瀏覽器不支援音訊播放。
    </audio>
  </section>

  <section class="audio-card">
    <h2>三、懺悔法門開示（下）</h2>
    <audio controls preload="metadata">
      <source src="part2.mp3" type="audio/mpeg">
      您的瀏覽器不支援音訊播放。
    </audio>
  </section>

</main>

<footer>
  南無大願地藏王菩薩
  <p>願以此功德，普及於一切。</p>
</footer>

</body>
</html>
